<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>OARO</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700;900&family=Rubik+Bubbles&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 레이아웃: 좌측 고정 사이드바(이름+카테고리) / 우측 썸네일 그리드, 상단 얇은 메타 바 */
:root {
  --bg: #f6f6f4;
  --paper: #ffffff;
  --ink: #161616;
  --muted: #9a9a96;
  --line: #e2e2de;
  --accent: #161616;
  --display: "Anton", "Noto Sans KR", Impact, sans-serif;
  --body: "Hanken Grotesk", "Noto Sans KR", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #121212; --paper: #1a1a1a; --ink: #f1f1ee; --muted: #77776f; --line: #2c2c2a; --accent: #f1f1ee; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #121212; --paper: #1a1a1a; --ink: #f1f1ee; --muted: #77776f; --line: #2c2c2a; --accent: #f1f1ee; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

.wrap { max-width: 1440px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; }
@media (min-width: 720px) { .wrap { padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); } }

/* 본문 2단 */
.layout { display: grid; gap: 32px; padding-top: 40px; }
@media (min-width: 900px) { .layout { grid-template-columns: 280px minmax(0, 1fr); gap: 56px; } }

.side { min-width: 0; }
@media (min-width: 900px) { .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 32px); align-self: start; } }
.name { font-family: var(--display); font-size: clamp(56px, 9vw, 96px); line-height: .88; letter-spacing: -.01em; text-transform: uppercase; margin: 0; }
.name sup { font-family: var(--body); font-size: .28em; vertical-align: top; position: relative; top: .25em; margin-left: 2px; color: var(--accent); }
.intro { margin: 20px 0 0; max-width: 32ch; color: var(--muted); line-height: 1.6; font-size: 13px; word-break: keep-all; }

.cats-label { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 32px 0 12px; }
.cats { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
@media (min-width: 900px) { .cats { flex-direction: column; gap: 2px; } }
.cat { display: inline-flex; align-items: baseline; gap: 4px; font-size: 15px; font-weight: 500; color: var(--muted); padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; transition: color .15s; }
.cat sup { font-family: var(--mono); font-size: 10px; }
.cat:hover { color: var(--ink); }
.cat[aria-pressed="true"] { color: var(--paper); background: var(--ink); border-color: var(--ink); }
@media (min-width: 900px) {
  .cat { font-family: var(--display); font-size: 34px; text-transform: uppercase; line-height: 1.05; padding: 0; border: 0; border-radius: 0; letter-spacing: .005em; }
  .cat[aria-pressed="true"] { background: none; color: var(--ink); }
  .cat[aria-pressed="true"]::before { content: "→"; font-family: var(--body); font-size: .6em; margin-right: 6px; color: var(--accent); align-self: center; }
}

/* 우측 헤더 */
.main { min-width: 0; }
.main-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
.main-head h2 { margin: 0; font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
.main-head h2 sup { font-size: 11px; font-weight: 400; margin-left: 2px; font-family: var(--mono); }

/* 그리드 */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 40px 20px; }
.card { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.thumb { position: relative; aspect-ratio: 4 / 5; max-width: 100%; overflow: hidden; border-radius: 6px; display: grid; place-items: center; transition: transform .35s cubic-bezier(.2,.7,.2,1); }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.card:hover .thumb { transform: translateY(-4px); }
.poster-word { font-size: clamp(40px, 5vw, 64px); line-height: .9; text-align: center; padding: 0 10px; word-break: keep-all; }
.poster-meta { position: absolute; left: 10px; right: 10px; bottom: 10px; display: flex; justify-content: space-between; font-family: var(--mono); font-size: 9px; letter-spacing: .06em; text-transform: uppercase; opacity: .8; }
.poster-meta.top { top: 10px; bottom: auto; }
.card-info { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card-title { font-size: 15px; font-weight: 600; letter-spacing: -.01em; word-break: keep-all; }
.card-sub { font-size: 12px; color: var(--muted); margin-top: 2px; word-break: keep-all; }
.card-year { font-family: var(--mono); font-size: 11px; color: var(--muted); flex-shrink: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag { font-family: var(--mono); font-size: 10px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
.soon { position: absolute; top: 10px; right: 10px; font-family: var(--mono); font-size: 10px; padding: 3px 8px; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; }

.empty { padding: 60px 0; color: var(--muted); }
.foot { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: var(--mono); font-size: 11px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) { .thumb { transition: none; } .card:hover .thumb { transform: none; } }
</style>

<div class="wrap">

  <div class="layout">
    <aside class="side">
      <h1 class="name">OARO<sup>°</sup></h1>
      <p class="cats-label">Category</p>
      <ul class="cats" id="cats"></ul>
    </aside>

    <main class="main">
      <div class="main-head">
        <h2 id="heading">Selected Works</h2>
      </div>
      <div id="works"></div>
      <footer class="foot">
        <span>© 2026 OARO</span>
        <span>Updated Nov 2026</span>
      </footer>
    </main>
  </div>
</div>

<script>
// 프로젝트 목록 — 새 사이트는 여기에 한 줄씩 추가 (img에 data URI를 넣으면 포스터 대신 사진이 보임)
const PROJECTS = [
  { title: "도깨비 빨래방", sub: "드래그로 둘러보고 물건을 눌러보는 360° 파노라마 빨래방", year: 2026, cats: ["360", "interactive"], tags: ["Panorama", "360°"], img: "thumbs/goblin.jpg",
    url: "https://shinggong.github.io/goblin-laundry/",
    poster: { word: "Goblin<br>Laundry", font: "'Rubik Bubbles'", bg: "linear-gradient(200deg,#d6ff4a,#2f8f5b)", fg: "#10240f", meta: ["360° Room", "Spin"] } },
  { title: "Pretty Girl", sub: "방향키와 하트 버튼으로 플레이하는 리센느 팬 픽셀 게임", year: 2026, cats: ["interactive"], tags: ["Pixel", "Game"], img: "thumbs/pretty-girl.jpg",
    url: "https://shinggong.github.io/pretty-girl/",
    poster: { word: "Pretty<br>Girl", font: "'Rubik Bubbles'", bg: "linear-gradient(160deg,#ffb3d1,#b2507c)", fg: "#fff4fa", meta: ["Pixel RPG", "Vol.01"] } },
  { title: "ON-REPEAT", sub: "커서를 따라 시선이 움직이는 3D 캐릭터와 유튜브 플레이리스트", year: 2026, cats: ["3d", "interactive"], tags: ["3D", "Playlist"], img: "thumbs/on-repeat.jpg",
    url: "https://shinggong.github.io/ON-REPEAT/",
    poster: { word: "ON<br>RE<br>PEAT", font: "var(--display)", bg: "radial-gradient(circle at 50% 35%,#6a6a6a,#141414 72%)", fg: "#f4f4f0", meta: ["Playlist", "Track 01"], up: true } },
];

const CATS = [
  { id: "all", label: "All" },
  { id: "3d", label: "3D" },
  { id: "360", label: "360°" },
  { id: "interactive", label: "Interactive" },
];

let cat = "all";
const h = location.hash.slice(1);
if (CATS.some(c => c.id === h)) cat = h;

const $ = s => document.querySelector(s);

function thumb(p) {
  if (p.img) return `<div class="thumb"><img src="${p.img}" alt=""></div>`;
  const q = p.poster;
  return `<div class="thumb" style="background:${q.bg};color:${q.fg}">
    <span class="poster-meta top"><span>${q.meta[0]}</span><span>${p.year}</span></span>
    <span class="poster-word" style="font-family:${q.font}${q.up ? ';text-transform:uppercase' : ''}">${q.word}</span>
    <span class="poster-meta"><span>OARO*</span><span>${q.meta[1]}</span></span>
    ${p.url ? "" : '<span class="soon">준비 중</span>'}
  </div>`;
}

function wrapLink(p, cls, inner) {
  return p.url
    ? `<a class="${cls}" href="${p.url}" target="_blank" rel="noopener">${inner}</a>`
    : `<div class="${cls}">${inner}</div>`;
}

function render() {
  const list = PROJECTS.filter(p => cat === "all" || p.cats.includes(cat));

  $("#cats").innerHTML = CATS.map(c => {
    const n = c.id === "all" ? PROJECTS.length : PROJECTS.filter(p => p.cats.includes(c.id)).length;
    return `<li><button class="cat" data-cat="${c.id}" aria-pressed="${c.id === cat}">${c.label}<sup>${n}</sup></button></li>`;
  }).join("");

  const label = CATS.find(c => c.id === cat).label;
  $("#heading").innerHTML = `${cat === "all" ? "Selected Works" : label}<sup>(${list.length})</sup>`;

  if (!list.length) { $("#works").innerHTML = '<p class="empty">이 카테고리엔 아직 작업이 없어요.</p>'; return; }

  $("#works").innerHTML = `<div class="grid">${list.map(p => wrapLink(p, "card", `
      ${thumb(p)}
      <div class="card-info">
        <div><div class="card-title">${p.title}</div><div class="card-sub">${p.sub}</div></div>
      </div>
      <div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join("")}</div>`)).join("")}</div>`;
}

$("#cats").addEventListener("click", e => {
  const b = e.target.closest("[data-cat]");
  if (!b) return;
  cat = b.dataset.cat;
  try { history.replaceState(null, "", "#" + cat); } catch (e) {}
  render();
});
render();
</script>
</body></html>
